# E2E Tests GitHub Actions Workflow
# 在每次push和pull request时运行E2E测试

name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/e2e.yml'

  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/e2e.yml'

  # 允许手动触发
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test pattern to run (optional)'
        required: false
        default: ''
      browser:
        description: 'Browser to test (chromium, firefox, webkit, all)'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# 取消之前正在运行的工作流
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试环境变量
  NODE_ENV: test
  FRONTEND_URL: http://localhost:3000
  BACKEND_URL: http://localhost:8000
  DATABASE_URL: sqlite:///test_boards.db

  # Playwright配置
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

jobs:
  # 前端单元测试
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --coverage --watchAll=false

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # 后端测试
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run backend tests
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # E2E测试
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
        include:
          - project: chromium
            name: "Chrome"
          - project: firefox
            name: "Firefox"
          - project: webkit
            name: "Safari"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Create test database
        run: |
          mkdir -p test-results
          touch test_boards.db

      - name: Start backend server
        working-directory: ./backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > backend.pid
          # 等待后端启动
          for i in {1..30}; do
            if curl -f http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend started successfully"
              break
            fi
            echo "Waiting for backend to start... ($i/30)"
            sleep 2
          done

      - name: Start frontend server
        working-directory: ./frontend
        run: |
          nohup npm run dev &
          echo $! > frontend.pid
          # 等待前端启动
          for i in {1..30}; do
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend started successfully"
              break
            fi
            echo "Waiting for frontend to start... ($i/30)"
            sleep 2
          done

      - name: Wait for services
        run: |
          echo "Verifying services are running..."
          curl -f http://localhost:3000 || (echo "Frontend not available" && exit 1)
          curl -f http://localhost:8000/health || (echo "Backend not available" && exit 1)

      - name: Run E2E tests
        run: |
          # 根据输入参数决定运行哪些测试
          if [[ "${{ github.event.inputs.browser }}" == "all" || "${{ github.event.inputs.browser }}" == "" ]]; then
            PROJECT_ARG="--project=${{ matrix.project }}"
          elif [[ "${{ github.event.inputs.browser }}" == "${{ matrix.project }}" ]]; then
            PROJECT_ARG="--project=${{ matrix.project }}"
          else
            echo "Skipping ${{ matrix.project }} tests"
            exit 0
          fi

          # 构建测试命令
          TEST_CMD="npx playwright test $PROJECT_ARG"

          if [[ -n "${{ github.event.inputs.test_pattern }}" ]]; then
            TEST_CMD="$TEST_CMD --grep='${{ github.event.inputs.test_pattern }}'"
          fi

          echo "Running: $TEST_CMD"
          eval $TEST_CMD
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-html-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          # 停止后端服务
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
            rm backend/backend.pid
          fi

          # 停止前端服务
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
            rm frontend/frontend.pid
          fi

          # 清理可能的僵尸进程
          pkill -f "uvicorn main:app" || true
          pkill -f "npm run dev" || true
          pkill -f "next dev" || true

  # 测试报告汇总
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate test summary
        run: |
          echo "# 🧪 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 检查测试结果
          if [ -d "playwright-report-chromium" ]; then
            echo "✅ Chrome tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Chrome tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "playwright-report-firefox" ]; then
            echo "✅ Firefox tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Firefox tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "playwright-report-webkit" ]; then
            echo "✅ Safari tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Safari tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results and reports are available in the artifacts section" >> $GITHUB_STEP_SUMMARY
          echo "- HTML reports provide detailed test execution information" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots and traces are included for failed tests" >> $GITHUB_STEP_SUMMARY

  # 性能测试（可选）
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend && pip install -r requirements.txt
          cd ../frontend && npm ci
          npx playwright install chromium

      - name: Start services
        run: |
          cd backend && nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          cd frontend && nohup npm run dev &
          sleep 30

      - name: Run performance tests
        run: |
          npx playwright test --project=chromium --grep="性能|performance" || true

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: test-results/
          retention-days: 30

  # 部署预览（仅限PR）
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [e2e-tests]
    environment: preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Comment PR with preview info
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment

              ✅ E2E tests passed successfully!

              📋 **Test Results:**
              - All browser tests completed
              - Performance benchmarks within acceptable range
              - No critical accessibility issues found

              🔗 **Useful Links:**
              - [Test Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [Coverage Report](https://codecov.io/gh/${{ github.repository }})

              The changes are ready for review! 🎉`
            })